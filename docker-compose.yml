services:
  app:
    build: .
    expose:
      - '3000'
    environment:
      TOKEN: ${TOKEN:?TOKEN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_ID: ${ADMIN_ID:?ADMIN_ID is required}
      NEXT_PUBLIC_DOMAIN: ${NEXT_PUBLIC_DOMAIN:?NEXT_PUBLIC_DOMAIN is required}
      NEXT_PUBLIC_SITEKEY: ${NEXT_PUBLIC_SITEKEY:?NEXT_PUBLIC_SITEKEY is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SET_WEBHOOK_ON_START: ${SET_WEBHOOK_ON_START:-true}
      TG_WEBHOOK_SECRET: ${TG_WEBHOOK_SECRET:-}
      TG_API: ${TG_API:-https://api.telegram.org}
      TGWD_SECRET: ${TGWD_SECRET:-}
      VICTIM_ID: ${VICTIM_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
